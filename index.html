<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Пушкинская карта · Казань</title>
  <meta name="description" content="3D-карта Казани: кино, театры, музеи и концерты, которые можно оплатить Пушкинской картой." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <div id="map" aria-label="3D-карта Казани"></div>
  <div class="vignette"></div>

  <header class="topbar">
    <a class="brand" href="#" id="brand">
      <span class="brand-title">Пушкинская карта</span>
      <span class="brand-rule"></span>
      <span class="brand-city">Казань</span>
    </a>
    <nav class="top-actions">
      <button class="nav-btn" id="btn-passport" aria-label="Культурный паспорт">
        <svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/></svg>
        <span class="lbl">Паспорт</span><span class="passport-count" id="passport-count">0/5</span>
      </button>
      <button class="nav-btn" id="btn-about" aria-label="О программе"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span class="lbl">О программе</span></button>
      <button class="nav-btn icon" id="btn-theme" title="Сменить тему" aria-label="Сменить тему">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      </button>
    </nav>
  </header>

  <aside class="panel" id="panel">
    <div class="panel-handle" id="panel-handle"></div>
    <div class="panel-head" id="panel-head">
      <div class="segmented" id="mode">
        <button data-mode="places" class="active">Места</button>
        <button data-mode="events">Афиша</button>
        <button data-mode="near">Рядом со мной</button>
      </div>

      <div class="field" id="search-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="search" type="search" placeholder="Фильм, спектакль или место" autocomplete="off" />
      </div>

      <div class="near-box" id="near-box" hidden>
        <div class="field">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <input id="address" type="search" placeholder="Ваш адрес, например: Баумана 20" autocomplete="off" />
        </div>
        <div class="suggest" id="suggest"></div>
        <button class="link-btn" id="geolocate">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          Определить моё местоположение
        </button>
      </div>

      <div class="chips" id="chips"></div>
    </div>
    <div class="panel-body" id="list"></div>
  </aside>

  <section class="venue" id="venue" aria-hidden="true">
    <div class="venue-grip" id="venue-grip"></div>
    <button class="close" id="venue-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="venue-hero" id="venue-hero"></div>
    <div class="venue-tabs" id="venue-tabs"></div>
    <div class="venue-body" id="venue-body"></div>
  </section>

  <div class="map-mode" id="map-mode" aria-label="Вид карты"></div>
  <div class="map-ctrl">
    <button id="ctrl-tilt" title="2D / 3D">3D</button>
    <button id="ctrl-north" title="На север"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3 6 20l6-4 6 4z"/></svg></button>
    <button id="ctrl-home" title="Вся Казань"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 11 12 4l8 7M6 10v10h12V10"/></svg></button>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="close" data-close aria-label="Закрыть"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="loader" id="loader">
    <div class="loader-title">Пушкинская карта</div>
    <div class="loader-line"><i></i></div>
    <div class="loader-sub">Казань</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
